  <path d="M91 29 C117 48 129 72 142 92 M198 98h40m-8-7 8 7-8 7" fill="none" stroke="#8ca1bb" stroke-width="3" stroke-dasharray="5 8" stroke-linecap="round" stroke-linejoin="round"/>
