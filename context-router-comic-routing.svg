<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">A task follows the router to just the right topic</title>
<desc id="desc">Three comic panels show a task arriving, a small kernel pointing the star router to one matching wiki topic, and the agent solving the task while unrelated pages stay closed.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19243d"/><stop offset="1" stop-color="#283755"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f1eee5"/></linearGradient>
</defs>
<rect width="1200" height="390" rx="26" fill="url(#sky)"/>
<g fill="#dce5ff" opacity=".55"><circle cx="38" cy="25" r="2"/><circle cx="390" cy="340" r="2"/><circle cx="810" cy="22" r="2"/><circle cx="1165" cy="345" r="2"/></g>
<g fill="url(#paper)" stroke="#d8dfed" stroke-width="2">
  <rect x="22" y="22" width="370" height="346" rx="20"/>
  <rect x="415" y="22" width="370" height="346" rx="20"/>
  <rect x="808" y="22" width="370" height="346" rx="20"/>
</g>
<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
  <circle cx="58" cy="51" r="15" fill="#f3d98d"/><text x="58" y="56" fill="#53667d">1</text>
  <circle cx="451" cy="51" r="15" fill="#f3d98d"/><text x="451" y="56" fill="#53667d">2</text>
  <circle cx="844" cy="51" r="15" fill="#f3d98d"/><text x="844" y="56" fill="#53667d">3</text>
</g>
<!-- panel 1: task card and short kernel -->
<g transform="translate(72 103)">
  <path d="M0 18q0-12 12-12h216q12 0 12 12v114q0 12-12 12h-118l-30 24v-24H12q-12 0-12-12z" fill="#fffdf8" stroke="#c8cfdd" stroke-width="2"/>
  <circle cx="44" cy="59" r="19" fill="#dce8e1"/>
  <path d="M44 46v26m-13-13h26" stroke="#587467" stroke-width="4" stroke-linecap="round"/>
  <path d="M79 48h130M79 70h112M79 92h122" stroke="#aab6c8" stroke-width="6" stroke-linecap="round"/>
  <rect x="40" y="174" width="190" height="78" rx="13" fill="#e6efe9" stroke="#a9c6b3" stroke-width="2"/>
  <text x="58" y="204" fill="#34475c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">AGENTS.md</text>
  <path d="M58 222h145M58 238h118" stroke="#8aa293" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- panel 2: the same little star router from the cover -->
<g transform="translate(594 206)">
  <path d="M0-55l13 26 29-9-13 27 22 20-30 3-9 29-14-26-29 9 12-27-22-20 30-3z" fill="#f3d98d"/>
  <path d="M-10-4q4-5 8 0M7-4q4-5 8 0" fill="none" stroke="#5c5260" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M-3 8q5 5 10 0" fill="none" stroke="#5c5260" stroke-width="2" stroke-linecap="round"/>
  <circle cx="-22" cy="8" r="3" fill="#e99d91"/><circle cx="22" cy="8" r="3" fill="#e99d91"/>
</g>
<g transform="translate(452 108)">
