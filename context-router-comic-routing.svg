  <path d="M143 84h148M143 101h126M143 118h136" stroke="#8aa293" stroke-width="5" stroke-linecap="round"/>
  <rect x="62" y="201" width="205" height="82" rx="12" fill="#dce3ef" stroke="#8796ae" stroke-width="2"/>
